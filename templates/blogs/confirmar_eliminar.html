{% extends "base.html" %}
{% load static %}
{% block content_header %}
<div class="content-header">
  <div class="container-fluid">
    <h1 class="m-0" style="color:#5a3826;">Eliminar Blog</h1>
  </div>
</div>
{% endblock %}
{% block content %}
<section class="content">
  <div class="container-fluid">
    <div class="card" style="max-width:500px; border-radius:16px; border:none; box-shadow:0 6px 18px rgba(90,56,38,0.12);">
      <div class="card-body">
        <p>¿Seguro que quieres eliminar el blog <strong>{{ blog.titulo }}</strong>?</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger" style="border-radius:8px;">
            <i class="fas fa-trash"></i> Sí, eliminar
          </button>
          <a href="{% url 'lista_blogs' %}" class="btn btn-outline-secondary" style="border-radius:8px;">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
