{% extends "base.html" %}
{% load static %}
{% block content_header %}
<div class="content-header">
  <div class="container-fluid">
    <h1 class="m-0" style="color:#5a3826;">{{ accion }} Blog</h1>
  </div>
</div>
{% endblock %}
{% block content %}
<section class="content">
  <div class="container-fluid">
    <div class="card" style="max-width:600px; border-radius:16px; border:none; box-shadow:0 6px 18px rgba(90,56,38,0.12);">
      <div class="card-body">
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="form-group">
            <label>Título</label>
            <input type="text" name="titulo" class="form-control" value="{{ blog.titulo|default:'' }}" required>
          </div>
          <div class="form-group">
            <label>Resumen</label>
            <textarea name="resumen" class="form-control" rows="2" maxlength="500" required>{{ blog.resumen|default:'' }}</textarea>
          </div>
          <div class="form-group">
            <label>Contenido completo</label>
            <textarea name="contenido" class="form-control" rows="6">{{ blog.contenido|default:'' }}</textarea>
          </div>
          <div class="form-group">
            <label>Imagen</label>
            {% if blog.imagen %}
              <br><img src="{{ blog.imagen.url }}" style="width:100px; margin-bottom:8px; border-radius:8px;">
            {% endif %}
            <input type="file" name="imagen" class="form-control">
          </div>
          <button type="submit" class="btn" style="background:#5a3826; color:#fff; border-radius:8px;">
            <i class="fas fa-save"></i> Guardar
          </button>
          <a href="{% url 'lista_blogs' %}" class="btn btn-outline-secondary" style="border-radius:8px;">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
