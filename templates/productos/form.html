{% extends "base.html" %}
{% load static %}
{% block content_header %}
<div class="content-header">
  <div class="container-fluid">
    <h1 class="m-0" style="color:#6f4e37;">{{ accion }} Producto</h1>
  </div>
</div>
{% endblock %}
{% block content %}
<section class="content">
  <div class="container-fluid">
    <div class="card" style="max-width:500px; border-radius:16px; border:none; box-shadow:0 6px 18px rgba(111,78,55,0.12);">
      <div class="card-body">
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="form-group">
            <label>Nombre</label>
            <input type="text" name="nombre" class="form-control" value="{{ producto.nombre|default:'' }}" required>
          </div>
          <div class="form-group">
            <label>Categoría</label>
            <select name="categoria" class="form-control">
              {% for cat in categorias %}
                <option value="{{ cat.id }}" {% if producto.categoria_id == cat.id %}selected{% endif %}>{{ cat.nombre }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label>Precio</label>
            <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio|default:'' }}" required>
          </div>
          <div class="form-group">
            <label>Stock</label>
            <input type="number" name="stock" class="form-control" value="{{ producto.stock|default:'0' }}" required>
          </div>
          <div class="form-group">
            <label>Foto</label>
            <input type="file" name="foto" class="form-control">
          </div>
          <button type="submit" class="btn btn-block" style="background:#6f4e37; color:#fff; border-radius:20px; padding:10px; font-weight:600;">Guardar</button>
        </form>
        <p class="mt-3 text-center">
          <a href="{% url 'lista_productos' %}">← Volver al inventario</a>
        </p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
