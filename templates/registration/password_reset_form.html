{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recuperar Contraseña</title>
  <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">
  <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
  <style>
    body.login-page { background: linear-gradient(135deg, #eef2ff 0%, #dbe4ff 100%); min-height: 100vh; }
    .login-box { margin-top: 6%; }
    .card { border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: none; }
    .btn-primary { background: #4e73df; border: none; border-radius: 8px; padding: 10px; font-weight: 600; }
    .btn-primary:hover { background: #224abe; }
    .form-control { border-radius: 8px; }
  </style>
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo"><b>Mi</b>Proyecto</div>
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">Ingresá tu correo para recuperar tu contraseña</p>
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <input type="email" name="email" class="form-control" placeholder="Correo electrónico" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Enviar</button>
      </form>
      <p class="mt-3 mb-1 text-center">
        <a href="{% url 'login' %}">← Volver al login</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
