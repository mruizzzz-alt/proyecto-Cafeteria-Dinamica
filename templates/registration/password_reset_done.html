{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Correo Enviado</title>
  <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">
  <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
  <style>
    body.login-page { background: linear-gradient(135deg, #eef2ff 0%, #dbe4ff 100%); min-height: 100vh; }
    .login-box { margin-top: 6%; }
    .card { border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: none; }
  </style>
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo"><b>Mi</b>Proyecto</div>
  <div class="card">
    <div class="card-body login-card-body text-center">
      <i class="fas fa-envelope-open-text text-primary" style="font-size: 3rem;"></i>
      <p class="mt-3">Si el correo existe en el sistema, te enviamos las instrucciones para restablecer tu contraseña.</p>
      <a href="{% url 'login' %}" class="btn btn-primary btn-block">Volver al login</a>
    </div>
  </div>
</div>
</body>
</html>
